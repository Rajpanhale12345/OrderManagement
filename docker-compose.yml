version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: order_mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: order_management
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - order_network

  backend:
    build: ./backend
    container_name: order_backend
    ports:
      - '4000:4000'
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: order_management
      PORT: 4000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - order_network

  frontend:
    build: ./frontend
    container_name: order_frontend
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - backend
    networks:
      - order_network

volumes:
  mysql_data:

networks:
  order_network:
    driver: bridge